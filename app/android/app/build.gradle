plugins {
    id 'com.android.application'
}

// ключ подписи для Google Play лежит в app/android/keystore (в git не класть)
def ksFile = rootProject.file('keystore/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.boxingtimer.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.germanpashiboulatov.dumbboxingtimer'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // lint из AGP 8.7 не работает на Java 25 из Android Studio
    lint {
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            // страница приложения собирается из прототипа скриптом app/build_web.py
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
