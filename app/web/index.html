<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dumb Boxing Timer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="ph/regular/style.css">
<link rel="stylesheet" href="ph/fill/style.css">
<link rel="stylesheet" href="ph/bold/style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0f1012;overflow:hidden;overscroll-behavior:none}
#host{position:fixed;inset:0}
#scr{position:absolute;transform-origin:0 0;overflow:hidden}
:root{--board:#e7e7e3;--ink:#1d1f22;--muted:#62666c;--red:#e3392d;--orange:#f28a1e;--blue:#2e8de6;--prep:#d8d3c6}
/* app */
.A{--qk:#2e8de6;--bg:#0f1012;--s1:#191b1e;--s2:#24272b;--tx:#f1f0ec;--tx2:#8e939a;font-family:"Golos Text","Noto Sans SC",sans-serif;color:var(--tx);background:var(--bg);user-select:none;-webkit-user-select:none}
.A .df{font-family:var(--df);font-weight:var(--dw)}
.A .dg{position:absolute;left:0;right:0;text-align:center;line-height:1;white-space:nowrap}
.A .dg .c{display:inline-block;text-align:center}
.A .bar{position:absolute;top:30px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.A .bar .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden}
.A .ico{width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center;font-size:20px;color:var(--tx);cursor:pointer;flex:none}
.A .menu{position:absolute;top:84px;left:16px;right:16px;display:grid;gap:10px}
.A .field{background:var(--s1);border-radius:16px;padding:12px 16px 14px}
.A .field .lab{display:flex;justify-content:space-between;align-items:center;gap:10px;height:40px}
.A .field .lab .ln{font-size:14px;color:var(--tx2);font-weight:500;white-space:nowrap;overflow:hidden}
.A .field .val{font-size:38px;line-height:1;cursor:text;white-space:nowrap;border-bottom:2px solid transparent;padding:0 2px}
.A .field .val input{font:inherit;color:inherit;background:transparent;border:0;outline:0;width:88px;text-align:right}
.A .field.edit .val{border-bottom-color:var(--red)}
.A .sl{position:relative;height:30px;margin-top:4px;touch-action:none;cursor:pointer}
.A .sl .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--s2)}
.A .sl .f{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:var(--tx)}
.A .sl .mk{position:absolute;top:22px;width:2px;height:5px;margin-left:-1px;background:#3a3e44;border-radius:1px}
.A .sl .k{position:absolute;top:15px;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--tx);box-shadow:0 0 0 5px var(--s1);transition:transform .08s}
.A .sl .k.snap{transform:scale(1.18)}
.A .sl .k.fine{background:var(--orange)}
.A .finehint{position:absolute;right:0;top:-2px;font-size:11px;color:var(--orange);display:none;white-space:nowrap}
.A .sl.finemode .finehint{display:block}
.A .presets{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.A .presets span{text-align:center;padding:6px 0;border-radius:9px;background:var(--s2);font-size:12px;font-weight:600;letter-spacing:-.02em;cursor:pointer;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.A .presets span.on{background:var(--tx);color:var(--bg)}
.A .total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 0;font-size:14px;color:var(--tx2)}
.A .total b{color:var(--tx);font-size:20px}
.A .start{position:absolute;left:16px;right:16px;bottom:26px;height:68px;border-radius:999px;background:var(--red);color:#fff;font-size:28px;letter-spacing:.06em;display:grid;place-items:center;cursor:pointer;white-space:nowrap;overflow:hidden}
.A .phase{position:absolute;top:56px;left:18px;right:18px;text-align:center;white-space:nowrap;letter-spacing:.12em;line-height:1.1}
.A .ringbox{position:absolute}
.A .ringbox svg{position:absolute;inset:0;overflow:visible}
.A .sub{position:absolute;left:0;right:0;text-align:center;font-size:14px;color:var(--tx2);white-space:nowrap;line-height:16px}
.A .rounds{position:absolute;left:20px;right:20px;top:406px}
.A .rounds .rl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.A .rounds .rl .rn{font-size:52px;line-height:1;white-space:nowrap}
.A .rounds .rl .rn em{font-style:normal;color:var(--tx2);font-size:28px}
.A .rounds .rl .rx{font-size:14px;color:var(--tx2);white-space:nowrap;text-align:right}
.A .ticks{display:grid;gap:3px;margin-top:12px}
.A .ticks i{height:8px;border-radius:2px;background:var(--s2)}
.A .ctrls{position:absolute;left:16px;right:16px;bottom:26px;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.A .btn{height:72px;border-radius:999px;display:grid;place-items:center;font-size:30px;background:var(--s1);color:var(--tx);cursor:pointer}
.A .btn.main{background:var(--tx);color:var(--bg)}
.A .scroll{position:absolute;top:84px;left:0;right:0;bottom:0;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.A .grp{margin-bottom:16px}
.A .grp h4{font-size:13px;font-weight:600;color:var(--tx2);padding:0 4px 8px}
.A .list{background:var(--s1);border-radius:16px;overflow:hidden}
.A .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;min-height:56px;cursor:pointer}
.A .it + .it{box-shadow:inset 0 1px 0 var(--s2)}
.A .it .l{font-size:15px;line-height:1.25;min-width:0}
.A .it .l small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
.A .it2{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px 14px}
.A .it2 + .it,.A .it + .it2,.A .it2 + .it2{box-shadow:inset 0 1px 0 var(--s2)}
.A .it2 .l{font-size:15px;line-height:1.25;min-width:0}
.A .it2 small{color:var(--tx2);font-size:12.5px;line-height:1.3;min-width:0}
.A .chip{white-space:nowrap;font-size:16px;font-weight:600;background:var(--s2);border-radius:10px;padding:5px 10px;font-variant-numeric:tabular-nums}
.A .tg{display:block;width:46px;height:28px;border-radius:999px;background:var(--s2);position:relative;flex:none}
.A .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--tx2);transition:left .15s}
.A .tg.on{background:var(--red)}
.A .tg.on::after{left:21px;background:#fff}
.A .rgt{display:flex;gap:8px;align-items:center;flex:none}
.A .seg{display:flex;gap:4px;background:var(--s2);border-radius:12px;padding:3px}
.A .seg span{padding:6px 7px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
.A .seg span.on{background:var(--tx);color:var(--bg)}
.A .play{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:16px;flex:none}
.A .fsample{font-size:30px;line-height:1;white-space:nowrap}
.A .fname{font-size:14px;color:var(--tx2);white-space:nowrap}
.A .chk{font-size:22px;color:var(--red)}
.A .beep{position:absolute;border-radius:50%;border:2px solid var(--orange);opacity:.35;pointer-events:none}
.A .pulse{animation:pulse .35s ease-out}
@keyframes pulse{0%{transform:scale(1.035)}100%{transform:scale(1)}}
/* cover */
.A .cph{position:absolute;left:20px;top:18px;white-space:nowrap;letter-spacing:.1em;line-height:1.1}
.A .crd{position:absolute;right:20px;top:14px;font-size:30px;line-height:1;white-space:nowrap}
.A .crd em{font-style:normal;color:var(--tx2);font-size:18px}
.A .cleft{position:absolute;left:14px;top:132px;font-size:34px;color:var(--tx2)}
.A .cset{position:absolute;left:14px;right:14px;top:14px;display:grid;gap:4px}
.A .crow{display:flex;align-items:center;justify-content:space-between;gap:8px;height:50px;padding:0 5px 0 14px;background:var(--s1);border-radius:14px}
.A .crow .cl{display:grid;gap:3px;min-width:0}
.A .crow .cl small{font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;line-height:1.1}
.A .crow .cl b{font-size:24px;line-height:1;white-space:nowrap;font-weight:inherit}
.A .stp{display:flex;gap:5px;flex:none}
.A .stp span{width:52px;height:40px;border-radius:11px;background:var(--s2);display:grid;place-items:center;font-size:20px;touch-action:none;cursor:pointer}
.A .stp span:active{background:#3a3e44}
.A .cgear{position:absolute;left:14px;bottom:14px;width:44px;height:44px;border-radius:14px;background:var(--s1);display:grid;place-items:center;font-size:22px;color:var(--tx);cursor:pointer}
.A .cstop{position:absolute;left:14px;bottom:14px;width:60px;height:56px;border-radius:16px;background:var(--s1);display:grid;place-items:center;font-size:26px;color:var(--tx);cursor:pointer}
.A .cok{position:absolute;left:14px;right:124px;bottom:14px;height:48px;border-radius:999px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:20px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;cursor:pointer}
/* горизонталь внутреннего экрана (scrLand): меню с ползунками в три колонки — поля 2×2, справа итог и СТАРТ */
.A .land{position:absolute;inset:0}
.A .land .bar{top:16px;left:16px;right:16px}
.A .land .menu{top:68px;left:16px;right:16px;grid-template-columns:1fr 1fr 200px;align-items:start}
.A .land .menu>.total{grid-column:3;grid-row:1;flex-direction:column;align-items:flex-end;gap:4px;padding:8px 4px 0}
.A .land .menu>.total b{font-size:30px}
.A .land .start{left:auto;right:16px;width:200px;bottom:24px}
.A .bar .rgt{gap:8px}
.A .ico.off{color:var(--red)}
/* ===== css: тема ===== */
.A .start{background:var(--start,var(--red));color:var(--startTx,#fff)}
/* экран тренировки: обёртка (в ней заливка) и раскладка круга */
.A .runscr{position:absolute;inset:0}
.A .runlay{position:absolute;left:0;right:0;top:34px;bottom:110px;display:grid;justify-items:center}
.A .runlay .phase,.A .runlay .rounds,.A .runlay .ringbox{position:relative;top:auto;left:auto;right:auto}
.A .runlay .phase{width:250px}
.A .runlay .rounds{width:246px}
.A .runlay.mid{grid-template-rows:1fr auto 1fr}
.A .runlay.mid .phase{grid-row:1;align-self:end;margin-bottom:14px}
.A .runlay.mid .ringbox{grid-row:2}
.A .runlay.mid .rounds{grid-row:3;align-self:start;margin-top:18px}
.A .runlay.top{grid-template-rows:auto 1fr auto auto}
.A .runlay.top .ringbox{grid-row:1;margin-top:8px}
.A .runlay.top .rounds{grid-row:3;margin-bottom:18px}
.A .runlay.top .phase{grid-row:4;margin-bottom:2px}
/* экраны темы */
.A .thdots{display:flex;gap:4px}
.A .thdots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.A .thsw{width:26px;height:26px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.45)}
.A .thprev{height:76px;border-radius:16px;display:grid;place-items:center;font-size:30px;margin-bottom:12px;box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.35)}
.A .thprev b{font-weight:var(--dw)}
.A .thpal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 2px 14px}
.A .thpal span{height:34px;border-radius:10px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.35)}
.A .thpal span.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tx)}
.A .thsl{padding:6px 0}
.A .thsl-l{display:flex;justify-content:space-between;align-items:center;gap:10px;height:20px;font-size:14px;color:var(--tx2)}
.A .thsl-l span{white-space:nowrap;overflow:hidden;min-width:0}
.A .thsl-l b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.A .thtr{position:relative;height:28px;border-radius:14px;margin-top:6px;touch-action:none;cursor:pointer}
.A .thtr i{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(0,0,0,.55);pointer-events:none}
.A .threset{margin-top:14px;height:52px;line-height:52px;border-radius:999px;background:var(--s1);text-align:center;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;padding:0 14px}
/* ===== конец css: тема ===== */
/* ===== css: звуки ===== */
.A .it.us{justify-content:flex-start;gap:8px;cursor:default}
.A .us .un{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A .us .rgt{margin-left:auto;gap:2px}
.A .uic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--tx2);cursor:pointer;flex:none}
.A .uic.uplus{background:var(--s2);color:var(--tx)}
.A .udel{background:var(--red);color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.A .uname{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--tx);background:var(--s2);border:0;outline:0;border-radius:10px;padding:8px 10px;user-select:text;-webkit-user-select:text}
.A .uerr{color:var(--red)}
.A .it[data-pick*=":u:"] .l span[data-ovf]{overflow-wrap:anywhere}
/* ===== конец css: звуки ===== */
/* ===== css: таймеры ===== */
/* риски линейки: минутные чуть заметнее */
.A .sl .mk.mj{height:7px;background:#50555c}
/* кнопки быстрого выбора: голубые, выбранная залита */
.A .presets.qk span{background:var(--s2);background:color-mix(in srgb,var(--qk) 24%,var(--s1));color:var(--qk);color:color-mix(in srgb,var(--qk) 55%,#fff)}
.A .presets.qk span.on{background:var(--qk);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
/* плотное меню, когда кнопки включены у двух и больше полей */
.A .menu.dense{gap:7px}
.A .menu.dense .field{padding:8px 14px 9px}
.A .menu.dense .field .lab{height:34px}
.A .menu.dense .field .val{font-size:34px}
.A .menu.dense .sl{height:27px;margin-top:2px}
.A .menu.dense .presets{margin-top:3px}
.A .menu.dense .presets span{padding:5px 0}
.A .menu.dense .total{padding-top:0}
/* ввод с клавиатуры: часы : минуты : секунды поверх поля */
.A .field{position:relative}
.A .kb{position:absolute;inset:0;z-index:3;background:var(--s1);border-radius:16px;box-shadow:inset 0 0 0 2px var(--red);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.A .kb .kbu{display:grid;justify-items:center;gap:3px}
.A .kb input{font-family:var(--df);font-weight:var(--dw);font-size:30px;line-height:1;color:var(--tx);background:var(--s2);border:0;outline:0;border-radius:10px;text-align:center;padding:5px 0;width:54px}
.A .kb input:focus{box-shadow:inset 0 0 0 2px var(--tx2)}
.A .kb small{font-size:11px;color:var(--tx2);white-space:nowrap;line-height:1}
.A .kb .kbc{font-size:26px;color:var(--tx2);padding-bottom:14px}
.A .kb .kbok{width:40px;height:40px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:20px;margin-left:6px;cursor:pointer;flex:none}
/* экран «Значения таймеров» */
.A .tst{display:flex;align-items:center;gap:4px;flex:none}
.A .tst > span{width:30px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:15px;cursor:pointer}
.A .tst > b{min-width:56px;text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:text;padding:5px 2px;border-radius:9px}
.A .tst input,.A .tqg input{font:inherit;color:inherit;background:transparent;border:0;outline:0;width:100%;text-align:center}
.A .tqg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:2px 14px 14px}
.A .tqg span{text-align:center;padding:8px 0;border-radius:10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;cursor:text;background:var(--s2);background:color-mix(in srgb,var(--qk) 24%,var(--s1));color:var(--tx)}
.A .tqh{padding:0 14px 6px;font-size:12.5px;color:var(--tx2);line-height:1.3}
.A .treset{display:grid;place-items:center;height:48px;border-radius:999px;background:var(--s1);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden}
/* ===== конец css: таймеры ===== */
/* ===== css: пресеты ===== */
.A .pbtn{height:52px;border-radius:999px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:16px;padding:0 16px}
.A .pbtn span{white-space:nowrap;overflow:hidden;min-width:0}
.A .pbtn.cancel{background:var(--s2);color:var(--tx)}
.A .pslot{background:var(--s1);border-radius:16px;padding:10px 10px 10px 14px;margin-bottom:8px;cursor:pointer;display:grid;gap:6px;box-shadow:inset 0 0 0 2px transparent}
.A .pslot.pick{box-shadow:inset 0 0 0 2px var(--red)}
.A .pslot .pnm{display:flex;gap:6px;align-items:center;height:28px;font-size:17px;font-weight:600;min-width:0}
.A .pslot .pnm .pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.A .pslot .pnm .pno{color:var(--tx2);font-weight:500;flex:none}
.A .pslot.empty .pnm{font-weight:500;color:var(--tx2)}
.A .pslot.empty.pick .pnm{color:var(--tx)}
.A .pslot .pfi{color:var(--red);font-size:18px;flex:none}
.A .prow{display:flex;justify-content:space-between;align-items:center;gap:6px;height:34px;overflow:hidden}
.A .pinfo{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;display:flex;gap:4px;align-items:center;min-width:0}
.A .pacts{display:flex;gap:4px;flex:none}
.A .pacts span{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:17px;cursor:pointer}
.A .pchip{height:34px;padding:0 10px;border-radius:10px;background:var(--s2);display:flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;flex:none}
.A .pchip.red{background:var(--red);color:#fff}
.A .pin{font:inherit;font-size:16px;font-weight:500;color:var(--tx);background:var(--s2);border:0;outline:0;border-radius:10px;height:34px;padding:0 10px;flex:1;min-width:0;user-select:text;-webkit-user-select:text}
.A .pok{width:34px;height:34px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:17px;flex:none;cursor:pointer}
.A .pbanner{display:grid;gap:8px;background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:16px;box-shadow:inset 4px 0 0 var(--red)}
.A .pbanner .pbt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;display:flex;gap:6px;align-items:center;min-width:0}
.A .pbanner .pbt i{color:var(--red);font-size:18px;flex:none}
.A .pbanner .pbr{display:grid;gap:8px;justify-items:start;min-width:0}
.A .pbanner .pbn{max-width:100%}
.A .pbanner .pbn{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;min-width:0}
/* ===== конец css: пресеты ===== */
@media (prefers-reduced-motion: reduce){.A .pulse{animation:none}.A .sl .k{transition:none}}

</style>
</head>
<body>
<div id="host"></div>
<script src="gongs.js"></script>
<script>
/* ================= data ================= */
// Gong 1 и Gong 2 (Zvukipro.com) лежат в sounds/gongs.js, которого нет в открытом коде: условия сайта запрещают выкладывать файлы.
// Без этого файла гонгов нет в списках звуков, а по умолчанию конец раунда gongdeep, конец отдыха bell1.
const USER_SND=window.USER_SND||null;

/* ================= utils ================= */
const fmt=s=>{s=Math.max(0,Math.round(s));const p=n=>String(n).padStart(2,'0');return s>=3600?Math.floor(s/3600)+':'+p(Math.floor(s%3600/60))+':'+p(s%60):Math.floor(s/60)+':'+p(s%60)};
const F=id=>FONTS.find(f=>f.id===id);
const cv=document.createElement('canvas').getContext('2d');
const MET={};
function metrics(f){
  if(MET[f.id])return MET[f.id];
  cv.font=`${f.w} 100px ${f.css}${FB}`;
  let dAdv=0;for(const d of '0123456789')dAdv=Math.max(dAdv,cv.measureText(d).width);
  const cAdv=cv.measureText(':').width;
  const m=cv.measureText('0123456789');
  const asc=m.actualBoundingBoxAscent,desc=m.actualBoundingBoxDescent;
  const fA=m.fontBoundingBoxAscent,fD=m.fontBoundingBoxDescent;
  const half=(100-(fA+fD))/2, base=half+fA;
  const inkC=base-(asc-desc)/2;
  return MET[f.id]={dAdv:dAdv/100,cAdv:cAdv/100,ih:(asc+desc)/100,inkC:inkC/100};
}
function textW(text,f,size,ls){cv.font=`${f.w} ${size}px ${f.css}${FB}`;return cv.measureText(text).width+(ls||0)*size*text.length}
function fitLabel(text,f,max,maxW,ls){let s=max;while(s>9&&textW(text,f,s,ls)>maxW)s-=0.5;return s}
function units(tpl,m){let u=0;for(const c of tpl)u+=(c===':'?m.cAdv:m.dAdv);return u}
function fitTime(tpl,f,R,subH,maxPx){
  const m=metrics(f),u=units(tpl,m),gap=subH?10:0;let lo=8,hi=maxPx;
  for(let i=0;i<22;i++){const s=(lo+hi)/2,W=s*u,H=s*m.ih+gap+(subH||0);
    if(Math.hypot(W/2,H/2)<=R*0.95)lo=s;else hi=s;}
  return Math.floor(lo);
}
function cells(text,f){const m=metrics(f);return [...text].map(c=>`<span class="c" style="width:${c===':'?m.cAdv:m.dAdv}em">${c}</span>`).join('')}
/* digits block centered at (cx,cy) inside a ring box; returns html */
function timeBlock({text,tpl,f,S,R,sub,maxPx,color}){
  const subH=sub?16:0,m=metrics(f),size=fitTime(tpl,f,R,subH,maxPx);
  const gap=sub?10:0,inkH=size*m.ih,C=S/2;
  const shift=sub?(gap+subH)/2:0, inkCY=C-shift;
  const top=inkCY-m.inkC*size;
  const iw=size*units(text,m);
  let h=`<div class="dg df" data-ink data-cx="${C}" data-cy="${inkCY}" data-iw="${iw}" data-ih="${inkH}" style="font-size:${size}px;top:${top}px;height:${size}px;${color?'color:'+color:''}">${cells(text,f)}</div>`;
  if(sub)h+=`<div class="sub" data-sub style="top:${inkCY+inkH/2+gap}px">${sub}</div>`;
  return h;
}
function ring(S,stroke,p,color,track){
  const r=(S-stroke)/2,c=2*Math.PI*r,cx=S/2;
  return `<svg viewBox="0 0 ${S} ${S}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
  ${p>0?`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${Math.max(0.001,c*p)} ${c}" transform="rotate(-90 ${cx} ${cx})"/>`:''}</svg>`;
}

/* ================= view model ================= */
/* v: {screen, phase, idx, left, dur, paused} */
function phaseInfo(v,c){
  const t=T[c.lang],COL=colsOf(c); // цвета фаз из настроек (блок «тема»)
  if(v.phase==='done')return{col:COL.done,label:t.pDone};
  if(v.paused)return{col:COL.pause,label:t.pPause,base:v.phase};
  if(v.phase==='prep')return{col:COL.prep,label:t.pPrep};
  if(v.phase==='rest')return{col:COL.rest,label:t.pRest};
  const warn=c.warnOn&&v.left<=c.warn;
  return{col:warn?COL.warn:COL.round,label:t.pRound,warn};
}
const isBig=(v,c)=>!v.paused&&v.phase==='round'&&c.countOn&&v.left<=c.count&&v.left>0;

function scrRun(v,c){
  const t=T[c.lang],f=F(c.font),pi=phaseInfo(v,c),big=isBig(v,c),COL=colsOf(c),look=runLook(pi.col,c);
  const S=270,stroke=34,R=S/2-stroke;
  const ringCol=look?look.fg:pi.col,track=look?look.track:COL.s2,curTick=look?look.cur:pi.col;
  const p=v.phase==='done'?1:Math.max(0,v.left/v.dur);
  let text,tpl,sub=null,maxPx=100;
  if(big){text=String(Math.ceil(v.left));tpl=String(c.count).replace(/\d/g,'8');maxPx=200}
  else if(v.phase==='done'){text=fmt(0);tpl='0:00';sub=t.done}
  else{text=fmt(Math.ceil(v.left));tpl=fmt(v.dur);sub=v.phase==='prep'?`${t.first} ${fmt(c.round)}`:`${t.of} ${fmt(v.dur)}`}
  const lsz=fitLabel(pi.label,f,26,250,.12);
  const digCol=look?null:(big?pi.col:(v.paused?COL.pause:null));
  const shown=v.phase==='rest'?v.idx:Math.min(v.idx,c.rounds);
  const done=v.phase==='rest'||v.phase==='done'?v.idx:v.idx-1;
  const ticks=Array.from({length:c.rounds},(_,i)=>`<i style="background:${i<done?'var(--tx)':(i===v.idx-1&&v.phase==='round'?curTick:'')}"></i>`).join('');
  const rx=v.phase==='rest'?`${t.nextR} ${v.idx+1}`:(v.phase==='prep'?'':t.roundW);
  const beep=pi.warn&&!big?`<div class="beep" style="inset:-12px"></div>`:'';
  return `<div class="runscr" ${look?`style="${look.style}"`:''}><div class="runlay ${runLayout(c)}">
  <div class="phase df" data-box style="color:${ringCol};font-size:${lsz}px">${pi.label}</div>
  <div class="ringbox" data-circle data-r="${S/2}" data-ir="${R}" style="width:${S}px;height:${S}px">${beep}
    <div class="ringsvg">${ring(S,stroke,p,ringCol,track)}</div>
    ${timeBlock({text,tpl,f,S,R,sub,maxPx,color:digCol})}</div>
  <div class="rounds" data-box><div class="rl"><span class="rn df" data-box>${shown}<em> / ${c.rounds}</em></span><span class="rx" data-box>${rx}</span></div>
   <div class="ticks" style="grid-template-columns:repeat(${c.rounds},1fr);gap:${c.rounds>40?1:3}px">${ticks}</div></div></div>
  <div class="ctrls" data-box>${v.phase==='done'?`<div class="btn main" style="grid-column:span 2" data-act="menu"><i class="ph ph-arrow-counter-clockwise"></i></div>`:
   `<div class="btn" data-act="stop"><i class="ph ph-stop"></i></div><div class="btn main" data-act="pause"><i class="ph-fill ${v.paused?'ph-play':'ph-pause'}"></i></div>`}</div></div>`;
}

function scrCover(v,c){

  if(v.screen!=='run'){pi={col:COL.round,label:t.start};text=fmt(c.round);tpl=text;p=1;rd=`<em>×</em>${c.rounds}`}

    if(big){text=String(Math.ceil(v.left));tpl=String(c.count).replace(/\d/g,'8');maxPx=160}

    rd=`${v.phase==='rest'?v.idx:Math.min(v.idx,c.rounds)}<em>/${c.rounds}</em>`;}
  cv.font=`${f.w} 30px ${f.css}${FB}`;const rw=cv.measureText(rd.replace(/<[^>]+>/g,'')).width+8;

  <div class="ringbox" data-circle data-r="${S/2}" data-ir="${R}" style="left:${left}px;top:${top}px;width:${S}px;height:${S}px">
   ${ring(S,stroke,p,idle?'#3a3d42':(look?look.fg:pi.col),look?look.track:COL.s2)}${timeBlock({text,tpl,f,S,R,sub:null,maxPx,color:digCol})}</div>
  ${idle?'<div class="cgear" data-box data-cact="setup"><i class="ph ph-gear-six"></i></div>':''}

const THC={scr:['bg','s1','s2','tx','tx2'],ph:['round','warn','rest','prep','pause','done'],btn:['start','qk']};
addDefaults({fill:'ring',ringPos:'mid',colors:{bg:'#0f1012',s1:'#191b1e',s2:'#24272b',tx:'#f1f0ec',tx2:'#8e939a',
  round:COL.round,warn:COL.warn,rest:COL.rest,prep:COL.prep,pause:COL.pause,done:COL.done,start:'#e3392d',qk:'#2e8de6'}});

const isHex=h=>typeof h==='string'&&/^#[0-9a-f]{6}$/i.test(h);
function colsOf(c){const d=DEF.colors,x=(c&&c.colors)||{},o={};for(const k in d)o[k]=isHex(x[k])?x[k]:d[k];return o}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function lum(h){const[r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
// контрастный цвет поверх h: тёмный или белый, у кого контраст больше
function onColor(h){const L=lum(h);return (L+.05)/.056>1.6*1.05/(L+.05)?'#111214':'#ffffff'} // белый, пока тёмный не заметно контрастнее (красный и синий — белым)
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`}
function hex2hsv(h){const[r,g,b]=hexRgb(h).map(x=>x/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let H=0;

// В настройках событие хранит свой звук как 'u:<id>'. Прослушивание по ▶ играет и при выключенном звуке.
Object.assign(T.ru,{mySnd:'Мои звуки',addSnd:'Добавить свой звук',addSndS:'аудиофайл с телефона',sndDel:'Удалить',sndErrRead:'Не удалось прочитать файл',sndErrBig:'Файл больше 10 МБ',sndErrDb:'Не удалось сохранить звук',sndBusy:'Загружаю…'});
Object.assign(T.en,{mySnd:'My sounds',addSnd:'Add your own sound',addSndS:'audio file from your phone',sndDel:'Delete',sndErrRead:'Couldn’t read this file',sndErrBig:'File is over 10 MB',sndErrDb:'Couldn’t save the sound',sndBusy:'Loading…'});
Object.assign(T.es,{mySnd:'Mis sonidos',addSnd:'Añadir sonido propio',addSndS:'archivo de audio del teléfono',sndDel:'Eliminar',sndErrRead:'No se pudo leer el archivo',sndErrBig:'El archivo supera 10 MB',sndErrDb:'No se pudo guardar el sonido',sndBusy:'Cargando…'});
Object.assign(T.zh,{mySnd:'我的声音',addSnd:'添加自定义声音',addSndS:'手机里的音频文件',sndDel:'删除',sndErrRead:'无法读取此文件',sndErrBig:'文件超过 10 MB',sndErrDb:'无法保存声音',sndBusy:'正在加载…'});
const USND={list:[],raw:{},db:null,loading:null,loaded:false,ren:null,del:null,msg:'',busy:false,pre:false};
const U_MAX=10*1024*1024;
const uEsc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uOK=id=>USND.list.some(x=>'u:'+x.id===id);
const U_BASE=ACTIONS.map(a=>a.opts.slice());
// имена своих звуков в SNDN и списки выбора у всех пяти событий (свои звуки перед «Без звука»)
function uSync(){
  for(const k in SNDN)if(k.startsWith('u:')&&!uOK(k))delete SNDN[k];
  USND.list.forEach(x=>{const n=uEsc(x.name);SNDN['u:'+x.id]={ru:n,en:n,es:n,zh:n}});
  const u=USND.list.map(x=>'u:'+x.id);
  ACTIONS.forEach((a,i)=>{const b=U_BASE[i];a.opts=b.filter(o=>o!=='none').concat(u,b.includes('none')?['none']:[])});
}
function uSaveMeta(){try{localStorage.setItem('bt_usnd',JSON.stringify(USND.list))}catch(e){}}
try{const l=JSON.parse(localStorage.getItem('bt_usnd')||'[]');if(Array.isArray(l))USND.list=l.filter(x=>x&&x.id&&typeof x.name==='string')}catch(e){}
uSync();
// выбранный свой звук удалён: событие откатывается на звук по умолчанию; обходит все объекты snd в настройках (и в пресетах внутри них)
function uFix(o,d){d=d||0;if(!o||typeof o!=='object'||d>6)return false;let ch=false;
  if(o.snd&&typeof o.snd==='object')for(const k in o.snd){const v=o.snd[k];if(typeof v==='string'&&((v.startsWith('u:')&&!uOK(v))||(!USER_SND&&(v==='user1'||v==='user2')))){o.snd[k]=(DEF.snd&&DEF.snd[k])||'none';ch=true}}
  for(const k in o)if(k!=='snd'&&o[k]&&typeof o[k]==='object'&&uFix(o[k],d+1))ch=true;
  return ch}
function uFixAll(){const a=uFix(cfg),b=EDIT&&EDIT!==cfg?uFix(EDIT):false;if(a||b)saveCfg();return a||b}
loadCfg=(f=>function(){f.apply(this,arguments);uFixAll()})(loadCfg);
CHANGE_HOOKS.push(uFixAll);
// IndexedDB
function uDB(){if(USND.db)return USND.db;
  USND.db=new Promise((res,rej)=>{try{const r=indexedDB.open('bt_sounds',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('snd'))r.result.createObjectStore('snd',{keyPath:'id'})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  USND.db.catch(()=>{USND.db=null});return USND.db}
function uTx(mode,fn){return uDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('snd',mode),out=fn(tx.objectStore('snd'));
  tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}))}
const uOnSounds=()=>typeof live!=='undefined'&&(live.screen==='sounds'||live.screen.startsWith('snd:'));
// при запуске: список из базы главнее копии в localStorage
function uLoad(){if(USND.loading)return USND.loading;
  return USND.loading=uTx('readonly',st=>st.getAll()).then(all=>{all=all||[];
    USND.raw={};all.forEach(x=>{USND.raw[x.id]=x.data});
    USND.list=all.map(x=>({id:x.id,name:x.name,t:x.t||0})).sort((a,b)=>a.t-b.t);
    USND.loaded=true;uSaveMeta();uSync();if(uFixAll())changed();if(uOnSounds())renderPhone();
  }).catch(e=>{console.warn('свои звуки',e);USND.loading=null})}
// декодирование в BUF['u:<id>'], играет существующий playBuf (короткие события обрезаются как гонги)
function uDecode(id){const k='u:'+id;if(BUF[k])return Promise.resolve(BUF[k]);
  return (USND.loaded?Promise.resolve():uLoad()).then(()=>{const d=USND.raw[id];if(!d)return null;return ac().decodeAudioData(d.slice(0)).then(b=>BUF[k]=b)})
    .catch(e=>{console.warn('sound',k,e);return null})}
function playUser(k,short){if(BUF[k]){playBuf(k,short);return}
  const t0=Date.now();uDecode(k.slice(2)).then(b=>{if(b&&Date.now()-t0<1500)playBuf(k,short)})}
// заранее декодировать на первом касании (контекст звука можно создавать только после жеста)
PDOWN.push(()=>{if(!USND.pre){USND.pre=true;Promise.resolve(USND.loaded||uLoad()).then(()=>USND.list.forEach(x=>uDecode(x.id)))}return false});
if(window.indexedDB)uLoad();
// добавление файла
let uInput=null;
function uPick(){if(!uInput){uInput=document.createElement('input');uInput.type='file';uInput.accept='audio/*';uInput.style.display='none';document.body.appendChild(uInput);
  uInput.addEventListener('change',()=>{const f=uInput.files&&uInput.files[0];uInput.value='';if(f)uAdd(f)})}
  uInput.click()}
function uMsg(m){USND.msg=m;USND.busy=false;if(uOnSounds())renderPhone()}
async function uAdd(f){const t=T[tgt().lang];
  if(f.size>U_MAX){uMsg(t.sndErrBig);return}
  USND.busy=true;USND.msg='';if(uOnSounds())renderPhone();
  let data,buf;
  try{data=await f.arrayBuffer();buf=await ac().decodeAudioData(data.slice(0))}catch(e){uMsg(t.sndErrRead);return}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const name=(f.name||'').replace(/\.[^.]+$/,'').trim().slice(0,40)||'sound';
  const rec={id,name,data,t:Date.now()};
  try{if(!USND.loaded)await uLoad();await uTx('readwrite',st=>st.put(rec))}catch(e){console.warn(e);uMsg(t.sndErrDb);return}
  USND.raw[id]=data;if(!USND.list.some(x=>x.id===id))USND.list.push({id,name,t:rec.t});BUF['u:'+id]=buf;uSaveMeta();uSync();uMsg('');
}
function uRename(id,name){name=String(name).trim().slice(0,40);const x=USND.list.find(x=>x.id===id);USND.ren=null;
  if(x&&name&&name!==x.name){x.name=name;uSaveMeta();uSync();
    uTx('readwrite',st=>{const r=st.get(id);r.onsuccess=()=>{if(r.result){r.result.name=name;st.put(r.result)}};return r}).catch(e=>console.warn(e))}
  if(uOnSounds())renderPhone()}
function uDelete(id){USND.list=USND.list.filter(x=>x.id!==id);delete USND.raw[id];delete BUF['u:'+id];USND.del=null;uSaveMeta();uSync();
  uTx('readwrite',st=>st.delete(id)).catch(e=>console.warn(e));uFixAll()}
// группа «Мои звуки» на экране Звуки
function uGroup(c,list){const t=T[c.lang];
  const play=x=>`<span class="play" data-box data-uplay="${x.id}"><i class="ph-fill ph-play"></i></span>`;
  const rows=list.map(x=>{
    if(USND.ren===x.id)return `<div class="it us">${play(x)}<input class="uname" data-box data-uinp="${x.id}" maxlength="40" value="${uEsc(x.name)}"></div>`;
    if(USND.del===x.id)return `<div class="it us"><span class="un" data-box>${uEsc(x.name)}</span><span class="rgt" data-box><span class="udel" data-udelok="${x.id}">${t.sndDel}</span><span class="uic" data-udelno><i class="ph ph-x"></i></span></span></div>`;
    return `<div class="it us">${play(x)}<span class="un" data-box>${uEsc(x.name)}</span><span class="rgt" data-box><span class="uic" data-uren="${x.id}"><i class="ph ph-pencil-simple"></i></span><span class="uic" data-udel="${x.id}"><i class="ph ph-trash"></i></span></span></div>`}).join('');
  const add=`<div class="it" data-uadd><div class="l" data-box data-ovf>${USND.busy?t.sndBusy:t.addSnd}<small>${USND.msg?`<span class="uerr">${USND.msg}</span>`:t.addSndS}</small></div><div class="rgt" data-box><span class="uic uplus"><i class="ph ph-plus"></i></span></div></div>`;
  return `<div class="grp"><h4 data-ovf>${t.mySnd}</h4><div class="list">${rows}${add}</div></div>`}
const uBaseSounds=SCR.sounds.html;
SCR.sounds.html=(c,id)=>{if(uFix(c))saveCfg();const h=uBaseSounds(c,id),i=h.lastIndexOf('</div>');return i<0?h:h.slice(0,i)+uGroup(c,USND.list)+h.slice(i)};
const uBaseSnd=SCR['snd:'].html;
SCR['snd:'].html=(c,id)=>{if(uFix(c))saveCfg();return uBaseSnd(c,id)};
CLICK.push(e=>{const g=s=>e.target.closest(s);let x;
  if(g('[data-uinp]'))return true;
  if(x=g('[data-uplay]')){playUser('u:'+x.dataset.uplay);return true}
  // выбор и прослушивание своего звука в списке события (id с двоеточием, общий обработчик делит по ':')
  if((x=g('[data-play]'))&&x.dataset.play.includes(':u:')){const i=x.dataset.play.indexOf(':'),k=x.dataset.play.slice(0,i);playSnd(x.dataset.play.slice(i+1),ACTIONS.find(a=>a.k===k).short);return true}
  if((x=g('[data-pick]'))&&x.dataset.pick.includes(':u:')){const i=x.dataset.pick.indexOf(':'),k=x.dataset.pick.slice(0,i),o=x.dataset.pick.slice(i+1);
    tgt().snd[k]=o;playSnd(o,ACTIONS.find(a=>a.k===k).short);renderPhone();return true}
  if(g('[data-uadd]')){USND.msg='';USND.del=null;uPick();return true}
  if(x=g('[data-uren]')){USND.ren=x.dataset.uren;USND.del=null;renderPhone();const inp=phoneHost.querySelector('[data-uinp]');
    if(inp){inp.focus();inp.select();inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur()});inp.addEventListener('blur',()=>uRename(inp.dataset.uinp,inp.value),{once:true})}return true}
  if(x=g('[data-udel]')){USND.del=x.dataset.udel;USND.ren=null;renderPhone();return true}
  if(x=g('[data-udelok]')){uDelete(x.dataset.udelok);renderPhone();return true}
  if(g('[data-udelno]')){USND.del=null;renderPhone();return true}
  USND.del=null;return false});
// доска: экран Звуки с образцами своих звуков, подтверждение удаления, ошибка, переименование, список выбора

// Диапазоны ползунков и кнопки быстрого выбора для четырёх полей меню. Живут в cfg.lim, значит входят в полные настройки пресета.
// lim[k]: min, max, snap (шаг магнита), qOn (кнопки включены), qN (сколько кнопок, 3–7), q (7 значений, показываются первые qN).
const LIM_KEYS=['round','rest','rounds','prep'];
const LIM_TIME={round:true,rest:true,rounds:false,prep:true};
const LIM_ABS={round:[1,3600],rest:[0,3600],rounds:[1,99],prep:[0,3600]}; // пределы для min/max в настройках
const LIM_SNAPS={t:[1,5,10,15,30,60],n:[1,2,5]};
addDefaults({lim:{
  round:{min:10,max:600,snap:10,qOn:true,qN:7,q:[20,30,40,60,90,120,180]},
  rest:{min:10,max:300,snap:10,qOn:true,qN:7,q:[15,30,45,60,90,120,180]},
  rounds:{min:1,max:30,snap:1,qOn:false,qN:7,q:[3,4,5,6,8,10,12]},
  prep:{min:0,max:60,snap:5,qOn:true,qN:7,q:[5,10,15,20,30,45,60]}}});
Object.assign(T.ru,{tMin:'Минимум',tMax:'Максимум',tSnap:'Шаг ползунка',tQ:'Кнопки быстрого выбора',tQN:'Сколько кнопок',tHint:'Нажмите на значение, чтобы ввести его с клавиатуры.',tReset:'Сбросить к стандартным',uH:'ч',uM:'мин',uS:'с'});
Object.assign(T.en,{tMin:'Minimum',tMax:'Maximum',tSnap:'Slider step',tQ:'Quick-pick buttons',tQN:'Number of buttons',tHint:'Tap a value to type it in.',tReset:'Reset to defaults',uH:'h',uM:'min',uS:'s'});
Object.assign(T.es,{tMin:'Mínimo',tMax:'Máximo',tSnap:'Paso del control',tQ:'Botones rápidos',tQN:'Número de botones',tHint:'Toca un valor para escribirlo.',tReset:'Restablecer',uH:'h',uM:'min',uS:'s'});
Object.assign(T.zh,{tMin:'最小值',tMax:'最大值',tSnap:'滑块步长',tQ:'快捷按钮',tQN:'按钮数量',tHint:'点按数值即可输入。',tReset:'恢复默认',uH:'时',uM:'分',uS:'秒'});

function limOf(c,k){c=c||cfg;if(!c.lim)c.lim=clone(DEF.lim);if(!c.lim[k])c.lim[k]=clone(DEF.lim[k]);return c.lim[k]}
function lim(k,c){const L=limOf(c,k);return{min:L.min,max:L.max,snap:L.snap||1,time:LIM_TIME[k]}}
// положение ручки в %, значение сверх максимума упирается в конец
function limPct(k,v,c){const s=lim(k,c),sp=s.max-s.min;return sp>0?Math.min(100,Math.max(0,(v-s.min)/sp*100)):0}
// риски линейки: шаг по диапазону, не больше 10 рисок
function limMarks(k,c){const s=lim(k,c),sp=s.max-s.min;if(!s.time||sp<=0)return'';
  const st=[5,10,15,30,60,120,300,600,900,1800].find(x=>sp/x<=10)||3600;let h='';
  for(let m=Math.floor(s.min/st)*st+st;m<s.max;m+=st)h+=`<i class="mk${st<60&&m%60===0?' mj':''}" style="left:${(m-s.min)/sp*100}%"></i>`;
  return h}
const limTxt=(k,v)=>LIM_TIME[k]?fmt(v):String(v);
function quickRow(k,c){const L=limOf(c,k);if(!L.qOn)return'';const vs=L.q.slice(0,L.qN);
  const lab=v=>LIM_TIME[k]&&v<60?String(v):limTxt(k,v);
  const small=vs.length>=6&&vs.some(v=>lab(v).length>=5)?' style="font-size:11px"':'';
  return `<div class="presets qk" style="grid-template-columns:repeat(${vs.length},1fr)">${vs.map(v=>`<span data-ovf data-q="${k}:${v}"${small} class="${c[k]===v?'on':''}">${lab(v)}</span>`).join('')}</div>`}
// проверка настроек одного поля: min<max в пределах LIM_ABS, 3–7 кнопок; значение кнопки при вводе зажимается в min..max
// (при смене min/max кнопки не трогаем, чтобы не терять набранное)
function fixLim(k,L){const[a,b]=LIM_ABS[k];
  L.min=Math.max(a,Math.min(b-1,Math.round(+L.min||0)));L.max=Math.max(L.min+1,Math.min(b,Math.round(+L.max||0)));
  L.qN=Math.max(3,Math.min(7,Math.round(+L.qN||7)));if(!Array.isArray(L.q))L.q=clone(DEF.lim[k].q);
  while(L.q.length<7)L.q.push(L.max);L.q=L.q.slice(0,7).map(v=>Math.max(a,Math.round(+v||0)));
  if(!(L.snap>0))L.snap=1}
function setLim(c,k,f,v){const L=limOf(c,k),[a,b]=LIM_ABS[k];
  if(f==='min')L.min=Math.max(a,Math.min(L.max-1,v));
  else if(f==='max')L.max=Math.min(b,Math.max(L.min+1,v));
  else if(f==='qN')L.qN=Math.max(3,Math.min(7,v));
  fixLim(k,L)}
// шаг кнопок −/+ для min/max: мелкий у малых значений, крупный у больших
const limStep=(k,v,dir)=>{if(!LIM_TIME[k])return 1;const x=dir>0?v:v-1;return x<60?5:x<600?10:x<1800?30:60};

function scrTimers(c){
  const t=T[c.lang],lab={round:t.round,rest:t.rest,rounds:t.rounds,prep:t.prep};
  const st=(k,f,v)=>`<span class="tst" data-box><span data-tstep="${k}:${f}:-1"><i class="ph-bold ph-minus"></i></span><b data-tedit="${k}:${f}">${v}</b><span data-tstep="${k}:${f}:1"><i class="ph-bold ph-plus"></i></span></span>`;
  const row=(l,r)=>`<div class="it"><div class="l" data-box data-ovf>${l}</div>${r}</div>`;
  return `${backBar(t.timersM)}
  <div class="scroll"><div class="tqh" style="padding:0 4px 12px">${t.tHint}</div>
   ${LIM_KEYS.map(k=>{const L=limOf(c,k);
    return `<div class="grp"><h4 data-ovf>${lab[k]}</h4><div class="list">
     ${row(t.tMin,st(k,'min',limTxt(k,L.min)))}
     ${row(t.tMax,st(k,'max',limTxt(k,L.max)))}
     ${row(t.tSnap,`<span class="chip" data-box data-tsnap="${k}">${L.snap}${LIM_TIME[k]?' '+t.s:''}</span>`)}
     ${row(t.tQ,`<span data-box><span class="tg ${L.qOn?'on':''}" data-tqon="${k}"></span></span>`)}
     ${L.qOn?row(t.tQN,st(k,'qN',L.qN))+`<div class="tqg">${L.q.slice(0,L.qN).map((v,i)=>`<span data-tqv="${k}:${i}">${limTxt(k,v)}</span>`).join('')}</div>`:''}
    </div></div>`}).join('')}
   <div class="treset" data-treset data-ovf>${t.tReset}</div>
  </div>`;
}
SCR.timers={html:c=>scrTimers(c),back:'settings'};

// ввод значения прямо в ячейке экрана настроек
function limInline(el,k,init,commit){
  el.innerHTML=`<input inputmode="numeric" autocomplete="off" value="${init}">`;const i=el.querySelector('input');i.focus();i.select();
  let fin=false;const done=save=>{if(fin)return;fin=true;if(save)commit(i.value);changed();renderPhone()};
  i.addEventListener('keydown',ev=>{if(ev.key==='Enter')done(true);if(ev.key==='Escape')done(false)});i.addEventListener('blur',()=>done(true));
}
CLICK.push(e=>{
  if(e.target.closest('input'))return false;
  const q=e.target.closest('[data-q]');if(q){const[k,v]=q.dataset.q.split(':');cfg[k]=+v;click(true);renderAll();return true}
  if(live.screen!=='timers')return false;
  const c=tgt();
  const sp=e.target.closest('[data-tstep]');if(sp){const[k,f,d]=sp.dataset.tstep.split(':'),dir=+d,cur=limOf(c,k)[f];

let lastT=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=(now-lastT)/1000;lastT=now;
  if(live.screen!=='run'||live.paused||live.phase==='done')return;
  if(dt>2){fastForward(dt);save();render();return}
  const prev=live.left;live.left-=dt*live.speed;
  for(let s=Math.ceil(prev)-1;s>=Math.max(0,Math.ceil(live.left));s--){onSecond(s)}
  if(live.left<=0){endPhase()}
  const key=live.phase+live.idx+Math.ceil(live.left)+live.paused;
  if(key!==live.lastShown){live.lastShown=key;save();renderPhone();renderCover();if(phaseInfo(vLive(),cfg).warn&&!isBig(vLive(),cfg)&&Math.ceil(live.left)===cfg.warn)pulse();if(isBig(vLive(),cfg))pulse()}
},50);

/* ---- clicks ---- */
phoneHost.addEventListener('click',e=>{
  if(MODE==='cover'){coverTap(e);return}
  phoneClick(e);
});
function phoneClick(e){
  for(const h of CLICK){if(h(e)){changed();return}}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='back'){navBack();return}
    if(act.startsWith('go:')){live.screen=act.slice(3)}
    else if(act==='mute'){cfg.mute=!cfg.mute;changed()}
    else if(act.startsWith('snd:')){live.screen=act}
    else if(act==='settings'){live.screen='settings'}else if(act==='menu'){live.screen='menu'}else if(act==='fonts'){live.screen='fonts'}
    else if(act==='start'){startWorkout();return}
    else if(act==='pause'){live.paused=!live.paused}
    else if(act==='stop'){live.screen='menu'}
    renderAll();return}
  const pl=e.target.closest('[data-play]');if(pl){const[k,o]=pl.dataset.play.split(':');playSnd(o,ACTIONS.find(a=>a.k===k).short);return}
  const pk=e.target.closest('[data-pick]');if(pk){const[k,o]=pk.dataset.pick.split(':');tgt().snd[k]=o;playSnd(o,ACTIONS.find(a=>a.k===k).short);changed();renderPhone();return}
  const pr=e.target.closest('[data-preset]');if(pr){cfg.round=+pr.dataset.preset;click(true);changed();renderAll();return}
  const tg=e.target.closest('[data-tg]');if(tg){const c=tgt();c[tg.dataset.tg]=!c[tg.dataset.tg];changed();renderPhone();return}
  const cy=e.target.closest('[data-cyc]');if(cy){const k=cy.dataset.cyc,l=CYCLE[k],c=tgt();c[k]=l[(l.indexOf(c[k])+1)%l.length];changed();renderPhone();return}
  const lg=e.target.closest('[data-lang]');if(lg){tgt().lang=lg.dataset.lang;changed();renderAll();return}
  const fo=e.target.closest('[data-font]');if(fo){tgt().font=fo.dataset.font;changed();renderAll();return}
  const vl=e.target.closest('[data-val]');if(vl&&!vl.querySelector('input'))editVal(vl);
}
function coverTap(e){
  if(e&&e.target.closest('[data-step]'))return;
  const ca=e&&e.target.closest('[data-cact]');
  if(ca&&ca.dataset.cact==='stop'){live.screen='menu';live.paused=false;live.cover='idle';click(false);renderAll();return}
  if(ca){live.cover=ca.dataset.cact==='setup'?'setup':'idle';click(false);renderAll();return}
  if(live.screen!=='run'&&live.cover==='setup')return;
  ac();if(live.screen!=='run'){startWorkout()}else if(live.phase==='done'){live.screen='menu';renderAll()}else{live.paused=!live.paused;renderAll()}
}
function stepVal(k,dir){
  const s=SL[k],st=s.snap||CSTEP[k];let v=cfg[k];
  if(dir>0&&v>=s.max||dir<0&&v<=s.min)return; // кламп по настройкам; значение с клавиатуры сверх максимума «+» не трогает
  v=dir>0?Math.floor(v/st)*st+st:Math.ceil(v/st)*st-st;v=Math.min(s.max,Math.max(s.min,v));
  if(v===cfg[k])return;cfg[k]=v;click(s.time?v%60===0:false);
  const el=coverHost.querySelector(`[data-cval="${k}"]`);if(el)el.textContent=k==='rounds'?v:fmt(v);
  renderPhone();changed();
}
let hold=null;
const holdStop=()=>{if(hold){clearTimeout(hold.t);hold=null}};
coverHost.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-step]');if(!b)return;e.preventDefault();ac();
  const [k,d]=b.dataset.step.split(':');holdStop();stepVal(k,+d);let n=0;
  const rep=()=>{if(!hold)return;stepVal(k,+d);n++;hold.t=setTimeout(rep,n>8?60:120)};
  hold={t:setTimeout(rep,420)};
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>coverHost.addEventListener(ev,holdStop));

// Строка в секунды: «1:30:00», «1:30», «130» (= 1:30), «45». fb — если ничего не ввели.
function parseTime(str,k,fb){
  if(fb===undefined)fb=cfg[k];str=String(str).trim();
  if(k==='rounds'){const n=parseInt(str.replace(/\D/g,''));return isNaN(n)?fb:n}
  if(str.includes(':')){const p=str.split(':').map(x=>parseInt(x)||0);while(p.length<3)p.unshift(0);return p[0]*3600+p[1]*60+p[2]}
  const d=str.replace(/\D/g,'');if(!d)return fb;
  if(d.length<=2)return parseInt(d);
  return parseInt(d.slice(0,-2))*60+parseInt(d.slice(-2));
}
// Ввод с клавиатуры: три поля ч : мин : с поверх поля меню (для раундов одно). Максимума ползунка нет, лишнее нормализуется: 90 мин = 1:30:00.
function editVal(vl){
  const k=vl.dataset.val,fld=vl.closest('.field');if(!fld||fld.querySelector('.kb'))return;fld.classList.add('edit');
  const t=T[cfg.lang],v=cfg[k],p2=n=>String(n).padStart(2,'0');
  const box=(n,val,cap,w)=>`<label class="kbu"><input data-kb="${n}" inputmode="numeric" autocomplete="off" value="${val}"${w?` style="width:${w}px"`:''}><small>${cap}</small></label>`;
  const h=k==='rounds'?box('n',v,t.rounds,90):
    box('h',Math.floor(v/3600),t.uH)+'<span class="kbc df">:</span>'+box('m',p2(Math.floor(v%3600/60)),t.uM)+'<span class="kbc df">:</span>'+box('s',p2(v%60),t.uS);
  fld.insertAdjacentHTML('beforeend',`<div class="kb">${h}<span class="kbok" data-kbok><i class="ph-bold ph-check"></i></span></div>`);
  const kb=fld.querySelector('.kb'),ins=[...kb.querySelectorAll('input')],num=n=>{const i=kb.querySelector(`[data-kb="${n}"]`);return i?(parseInt(i.value.replace(/\D/g,''))||0):0};
  let fin=false;
  const done=()=>{if(fin)return;fin=true;
    if(k==='rounds')cfg[k]=Math.min(99,Math.max(1,num('n')));
    else cfg[k]=Math.min(359999,Math.max(k==='round'?1:0,num('h')*3600+num('m')*60+num('s')));
    changed();renderAll()};
  const first=k==='rounds'?ins[0]:(v>=3600?ins[0]:ins[1]);first.focus();first.select();
  ins.forEach(i=>{i.addEventListener('focus',()=>i.select());
    i.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();done()}if(ev.key==='Escape'){fin=true;renderAll()}});
    i.addEventListener('input',()=>{if(i.dataset.kb==='m'&&i.value.replace(/\D/g,'').length>=2){const s=kb.querySelector('[data-kb="s"]');s.focus()}})});
  kb.addEventListener('focusout',()=>setTimeout(()=>{if(!kb.contains(document.activeElement))done()},0));
  kb.addEventListener('pointerdown',ev=>{if(ev.target.closest('[data-kbok]')){ev.preventDefault();done()}});
}

/* ---- magnet slider ---- */
let drag=null;
phoneHost.addEventListener('pointerdown',e=>{
  for(const h of PDOWN){if(h(e))return}
  const sl=e.target.closest('[data-slider]');if(!sl)return;e.preventDefault();ac();
  const k=sl.dataset.slider;sl.setPointerCapture(e.pointerId);
  drag={k,sl,fine:false,fx:0,fv:0};moveDrag(e);
});
phoneHost.addEventListener('pointermove',e=>{if(drag)moveDrag(e)});
const endDrag=()=>{if(!drag)return;drag.sl.classList.remove('finemode');drag=null;changed();renderAll()};
phoneHost.addEventListener('pointerup',endDrag);phoneHost.addEventListener('pointercancel',endDrag);
function moveDrag(e){
  const {k,sl}=drag,s=SL[k],tr=sl.querySelector('.tr').getBoundingClientRect(),scale=tr.width/254;
  const dy=Math.abs(e.clientY-(tr.top+tr.height/2))/scale;
  let v=cfg[k];
  const wantFine=s.time&&dy>40;
  if(wantFine&&!drag.fine){drag.fine=true;drag.fx=e.clientX;drag.fv=cfg[k];sl.classList.add('finemode')}
  if(!wantFine&&drag.fine){drag.fine=false;sl.classList.remove('finemode')}
  if(drag.fine){v=drag.fv+Math.round((e.clientX-drag.fx)/(9*scale))}
  else{const p=Math.min(1,Math.max(0,(e.clientX-tr.left)/tr.width));v=Math.round((s.min+p*(s.max-s.min))/s.snap)*s.snap}
  v=Math.min(s.max,Math.max(s.min,v));
  if(v!==cfg[k]){cfg[k]=v;const strong=s.time?(v%60===0):false;click(strong);updateField(k,true)}
}
function updateField(k,snap){
  const s=SL[k],fld=phoneHost.querySelector(`[data-field="${k}"]`);if(!fld)return;
  const p=limPct(k,cfg[k]);
  fld.querySelector('.f').style.width=p+'%';const kn=fld.querySelector('.k');kn.style.left=p+'%';
  kn.classList.toggle('fine',!!(drag&&drag.fine));
  if(snap){kn.classList.add('snap');clearTimeout(kn._t);kn._t=setTimeout(()=>kn.classList.remove('snap'),90)}
  fld.querySelector('[data-val]').textContent=k==='rounds'?cfg[k]:fmt(cfg[k]);
  fld.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',+x.dataset.q.split(':')[1]===cfg[k]));
  const tot=phoneHost.querySelector('[data-tot]');if(tot)tot.textContent=fmt(cfg.prep+cfg.rounds*cfg.round+(cfg.rounds-1)*cfg.rest);
  renderCover();
}



/* ================= обёртка приложения ================= */
let MODE='phone',MUTE=false,SC=1;
const NATIVE=window.Native||null;
if(NATIVE){navigator.vibrate=p=>{try{NATIVE.vibrate(JSON.stringify(Array.isArray(p)?p:[p]))}catch(e){}return true}}
function keepAwake(){if(NATIVE)try{NATIVE.keepAwake(!!cfg.awake)}catch(e){}}
// Режимы по пропорции окна H/W: 'phone' — вертикаль (от 1.4), 'cover' — внешний экран (почти квадрат, Flip6 около 1.04),
// 'land' — горизонталь внутреннего экрана (меньше 0.75, Flip6 около 0.41).
// CV(): показывать раскладку внешнего экрана 286×298 — на внешнем экране и в горизонтали во время тренировки.
const CV=()=>MODE==='cover'||(MODE==='land'&&live.screen==='run');
function layout(){
  const W=innerWidth,H=innerHeight;
  const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&MODE!=='cover')return false;
  const r=H/W,m=r>=1.4?'phone':r>=0.75?'cover':'land';
  const ch=m!==MODE;MODE=m;
  if(m==='cover'){SC=Math.min(W/286,H/298)}else if(m==='land'){SC=Math.min(W/LAND_W,H/LAND_H)}else{SC=Math.min(W/286,H/690)}
  return ch;
}
// поля окна вокруг экрана красим тем же цветом, что фон экрана (с учётом заливки фазой)
function paintBody(){const s=document.getElementById('scr');if(!s)return;
  const r=s.querySelector('.runscr'),bg=r&&getComputedStyle(r).backgroundColor;
  const fill=bg&&bg!=='rgba(0, 0, 0, 0)';
  if(fill)s.style.background=bg; // иначе по краю экрана просвечивает тёмный фон полоской
  document.body.style.background=fill?bg:getComputedStyle(s).backgroundColor}
function frame(inner,h){
  const W=innerWidth,H=innerHeight,f=F(cfg.font);
  let k=SC,w=286,hh,left,top=0;
  if(CV()){k=Math.min(W/286,H/298);hh=298;top=(H-298*k)/2}   // 286×298 по центру окна
  else if(MODE==='land'){hh=H/k;w=live.screen==='menu'?Math.min(LAND_MAXW,Math.floor(W/k)):Math.min(480,Math.floor(W/k))}
  else hh=Math.max(690,H/k);
  left=(W-w*k)/2;
  setTimeout(paintBody,0);
  return `<div id="scr" class="scr A" style="--df:${f.css}${FB};--dw:${f.w};${themeVars(cfg)}left:${left}px;top:${top}px;width:${w}px;height:${hh}px;transform:scale(${k})">${inner}</div>`;
}
// горизонталь во время тренировки: касание как на внешнем экране (пауза/продолжить)
CLICK.unshift(e=>{if(MODE==='land'&&live.screen==='run'){coverTap(e);return true}return false});
function renderPhone(){
  if(CV())return;
  const inner=MODE==='land'&&live.screen==='menu'?scrLand(cfg):screenHTML();
  const st=phoneHost.querySelector('.scroll')?.scrollTop||0;
  phoneHost.innerHTML=frame(inner);
  const sc=phoneHost.querySelector('.scroll');if(sc)sc.scrollTop=st;
}
function renderCover(){
  if(!CV())return;
  phoneHost.innerHTML=frame(coverInner());
}
function render(){renderPhone();renderCover();save();keepAwake()}
function renderAll(){render()}
function fastForward(el){
  if(live.screen!=='run'||live.paused||live.phase==='done')return;
  MUTE=true;
  try{while(el>0&&live.phase!=='done'){if(live.left>el){live.left-=el;el=0}else{el-=live.left;live.left=0;endPhase()}}}finally{MUTE=false}
}
function save(){
  try{localStorage.setItem('bt_cfg',JSON.stringify(cfg));
    localStorage.setItem('bt_live',JSON.stringify({live:{screen:live.screen,phase:live.phase,idx:live.idx,left:live.left,dur:live.dur,paused:live.paused},t:Date.now()}))}catch(e){}
}
function restore(){
  loadCfg();
  try{const s=JSON.parse(localStorage.getItem('bt_live')||'null');
    if(s&&s.live&&s.live.screen==='run'&&s.live.phase!=='done'){Object.assign(live,s.live);fastForward((Date.now()-s.t)/1000)}}catch(e){}
}
window.goBack=function(){
  if(MODE==='cover'&&live.cover==='setup'&&live.screen!=='run'){live.cover='idle';render();return true}
  if(live.screen!=='run'&&live.screen!=='menu'){const b=backOf(live.screen);if(b){live.screen=b;render();return true}}
  if(live.screen==='run'&&live.phase!=='done'&&!live.paused){live.paused=true;render();return true}
  if(live.screen==='run'){live.screen='menu';render();return true}
  return false;
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('resize',()=>{const ch=layout();if(ch||MODE==='cover'||!document.activeElement||document.activeElement.tagName!=='INPUT')render()});
let lastWH='';
setInterval(()=>{const wh=innerWidth+'x'+innerHeight;if(wh!==lastWH){lastWH=wh;const ae=document.activeElement;if(!ae||ae.tagName!=='INPUT'){layout();render()}}},300);
restore();layout();render();
document.fonts&&document.fonts.ready.then(()=>{for(const k in MET)delete MET[k];render()});

</script>
